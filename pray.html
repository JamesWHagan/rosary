<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pray the Rosary — Decade4U</title>
  <meta name="description" content="Pray the Holy Rosary, bead by bead.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="setup" id="setup" hidden>
    <a class="link back-home" href="./">← Home</a>
    <h2>Pray for others</h2>
    <p class="lead">Each decade you pray is for one person's intention.</p>

    <div class="field">
      <div class="label">How many decades?</div>
      <div class="seg" id="decades">
        <button type="button" data-n="1">1</button>
        <button type="button" data-n="2">2</button>
        <button type="button" data-n="3">3</button>
        <button type="button" data-n="4">4</button>
        <button type="button" data-n="5">5<small>Full rosary</small></button>
      </div>
      <p class="fine" id="setup-note"></p>
    </div>

    <div class="field">
      <div class="label">How will you pray?</div>
      <div class="modes" id="modes">
        <button class="choice" type="button" data-mode="beads">
          <strong>Bead by bead</strong>
          <span>Every prayer on screen. Tap the prayer or Next to move on.</span>
        </button>
        <button class="choice" type="button" data-mode="own">
          <strong>With my own rosary</strong>
          <span>Count on your own beads. One screen per decade.</span>
        </button>
      </div>
    </div>

    <div class="field">
      <div class="label">You will pray for</div>
      <ol class="assigned" id="assigned"></ol>
      <p class="fine">These are sample intentions while we build the real ones.</p>
    </div>

    <button class="btn primary start" id="start" type="button">Start</button>
  </section>

  <div class="pray" id="prayer" hidden>
    <div class="topbar">
      <a class="link" href="./">← Home</a>
      <button class="pill" id="hide" type="button" aria-pressed="false">Hide prayers</button>
      <button class="link" id="restart" type="button">Start over</button>
    </div>
    <div class="where" id="where"></div>
    <div class="progress" aria-hidden="true"><div id="bar"></div></div>

    <div class="rosary-wrap" id="ring">
      <svg id="rosary" viewBox="0 0 300 405" aria-hidden="true"></svg>
    </div>

    <div class="strip empty" id="strip" aria-live="polite">
      <div class="strip-myst" id="strip-myst"></div>
      <div class="strip-int"><span class="strip-who" id="strip-who"></span> <span class="strip-what" id="strip-what"></span></div>
    </div>

    <section class="card" id="card" aria-live="polite">
      <div class="for-line" id="for-line" hidden></div>
      <div class="kicker" id="kicker"></div>
      <h2 id="prayer-title"></h2>
      <div class="text" id="prayer-text"></div>
    </section>

    <p class="gesture-hint" id="gesture-hint" hidden></p>

    <nav class="controls">
      <button class="btn" id="back" type="button">Back</button>
      <button class="btn primary" id="next" type="button">Next</button>
    </nav>
  </div>

  <section class="done" id="done" hidden>
    <h2 tabindex="-1">Amen.</h2>
    <p id="done-lead"></p>
    <ul class="thanks" id="thanks"></ul>
    <div class="actions">
      <button class="btn primary" id="again" type="button">Pray again</button>
      <a class="btn" href="./">Home</a>
    </div>
  </section>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="js/prayers.js"></script>
  <script src="js/samples.js"></script>
  <script src="js/rosary.js"></script>
</body>
</html>
