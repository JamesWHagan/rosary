<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Decade4U — Pray for One Another</title>
  <meta name="description" content="Pray the rosary for one another's intentions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <main>
    <div class="beads-row" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <h1 class="serif">Decade4U</h1>
    <p>Share your intention, and pray a decade for someone else's.</p>
    <div id="home-stat" hidden></div>
    <div class="actions">
      <a class="btn primary" href="pray.html">Pray for others</a>
      <p class="soon">Sharing your own intention is coming soon.</p>
    </div>
  </main>
  <script src="js/stats.js"></script>
  <script>
    (function () {
      var n = DecadeStats.prayedFor();
      if (n > 0) {           // no sad zero: the ring appears after your first decade
        var host = document.getElementById("home-stat");
        host.hidden = false;
        DecadeStats.ring(host, n, n === 1 ? "person you have prayed for" : "people you have prayed for");
      }
    })();
  </script>
</body>
</html>
