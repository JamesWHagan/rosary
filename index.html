<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Decade4U — Pray for One Another</title>
  <meta name="description" content="Pray the rosary for one another's intentions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="home">
  <main>
    <header class="hero">
      <div class="beads-row" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <h1 class="serif">Decade4U</h1>
      <p class="tagline">One decade. One person. One prayer.</p>
      <p class="intro">Pray the Holy Rosary for people who asked for prayer. Every decade you pray is for someone else's intention.</p>
    </header>

    <section class="need" id="need" hidden>
      <h2 id="need-title"></h2>
      <ul id="need-list"></ul>
      <a class="btn primary" id="need-go" href="pray.html"></a>
    </section>

    <div id="home-stat" hidden></div>

    <div class="actions">
      <a class="btn" id="pray-others" href="pray.html">Choose how many decades</a>
      <a class="btn" href="submit.html">Share your own intention</a>
      <a class="btn" id="my-link" href="mine.html" hidden>My intentions</a>
    </div>

    <footer class="foot">
      Free forever · <a href="https://github.com/JamesWHagan/rosary">Open source</a>
    </footer>
  </main>
  <script src="js/samples.js"></script>
  <script src="js/intentions.js"></script>
  <script src="js/stats.js"></script>
  <script>
    (function () {
      // "My intentions" appears once this browser has shared one
      try { if (JSON.parse(localStorage.getItem("decade4u.myIntentions.v1") || "[]").length) document.getElementById("my-link").hidden = false; } catch (e) {}

      var n = DecadeStats.prayedFor();
      if (n > 0) {           // no sad zero: the ring appears after your first decade
        var host = document.getElementById("home-stat");
        host.hidden = false;
        DecadeStats.ring(host, n, n === 1 ? "person you have prayed for" : "people you have prayed for");
      }

      // "Maria, Luca and one more person need your prayers": people nobody has prayed for yet
      Intentions.featured().then(function (r) {
        var pick = r.intentions;
        if (!pick.length) {
          // nobody is waiting: offer 3 general intentions instead
          var gen = Intentions.general(3);
          document.getElementById("need-title").textContent = "Everyone has been prayed for. Thank you 🙏";
          var lead = document.createElement("p");
          lead.className = "need-lead";
          lead.textContent = "Would you pray a decade for each of them?";
          var gl = document.getElementById("need-list");
          gl.before(lead);
          gen.forEach(function (it) {
            var li = document.createElement("li");
            var b = document.createElement("span"); b.className = "nm"; b.textContent = "General intention";
            var t = document.createElement("span"); t.className = "tx"; t.textContent = it.intention;
            li.appendChild(b); li.appendChild(t); gl.appendChild(li);
          });
          var g = document.getElementById("need-go");
          g.href = "pray.html?for=" + gen.map(function (it) { return it.id; }).join(",");
          g.textContent = "Pray for these · 3 decades";
          document.getElementById("need").hidden = false;
          return;
        }
        // named people first, so the cards follow the same order as the heading
        pick = pick.filter(function (it) { return !Intentions.isAnonymous(it); })
                   .concat(pick.filter(function (it) { return Intentions.isAnonymous(it); }));
        var names = pick.filter(function (it) { return !Intentions.isAnonymous(it); }).map(function (it) { return it.name; });
        var others = pick.length - names.length;
        var count = ["", "one", "two", "three"];
        var parts = names.slice();
        if (others) {
          if (!names.length) parts = [pick.length === 1 ? "Someone" : count[others].charAt(0).toUpperCase() + count[others].slice(1) + " people"];
          else parts.push(others === 1 ? "one more person" : count[others] + " others");
        }
        var who = parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts[0];
        var needs = pick.length === 1 && (names.length === 1 || !names.length) ? " needs" : " need";
        document.getElementById("need-title").textContent = who + needs + " your prayers";

        var ul = document.getElementById("need-list");
        pick.forEach(function (it) {
          var li = document.createElement("li");
          var b = document.createElement("span");
          b.className = "nm";
          b.textContent = Intentions.isAnonymous(it) ? "Someone" : it.name;
          var t = document.createElement("span");
          t.className = "tx";
          t.textContent = it.intention;
          li.appendChild(b); li.appendChild(t);
          ul.appendChild(li);
        });
        if (r.waiting > pick.length) {
          var more = document.createElement("p");
          more.className = "waiting";
          more.textContent = r.waiting + " intentions are waiting for their first prayer.";
          ul.after(more);
        }
        var go = document.getElementById("need-go");
        go.href = "pray.html?for=" + pick.map(function (it) { return encodeURIComponent(it.id); }).join(",");
        go.textContent = pick.length === 1 ? "Pray a decade for them" : "Pray for them · " + pick.length + " decades";
        document.getElementById("need").hidden = false;
      });
    })();
  </script>
</body>
</html>
